<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>هانلی | فروشگاه لوازم آرایشی</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#fff7fa;
  color:#333
}
header{
  background:#d81b60;
  color:white;
  padding:18px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10
}
header h1{margin:0 0 8px}
header p{margin:0}
nav{
  margin-top:12px;
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap
}
button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  font-family:inherit
}
.nav-btn{background:white;color:#d81b60}
.container{max-width:1100px;margin:auto;padding:20px}
.search{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  margin-bottom:20px;
  font-family:inherit
}
.categories{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:20px
}
.categories button{background:#f8d7e3}
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px
}
.product{
  background:white;
  border-radius:15px;
  padding:15px;
  box-shadow:0 3px 12px #00000012;
  text-align:center
}
.product .emoji{font-size:50px}
.product h3{font-size:16px}
.price{
  color:#d81b60;
  font-weight:bold;
  margin:10px
}
.add{
  background:#d81b60;
  color:white;
  width:100%
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;
  padding:15px;
  overflow:auto
}
.modal-box{
  background:white;
  max-width:600px;
  margin:30px auto;
  padding:20px;
  border-radius:18px
}
.close{
  background:#eee;
  float:left
}
.cart-item{
  border-bottom:1px solid #eee;
  padding:12px 0
}
.item-top{
  display:flex;
  justify-content:space-between;
  gap:10px
}
.controls{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:10px
}
.qty-btn{
  background:#f3d4df;
  width:38px;
  height:38px;
  font-size:20px;
  padding:0
}
.qty{
  min-width:30px;
  text-align:center;
  font-weight:bold
}
.delete{
  background:#ffe0e0;
  color:#c00;
  margin-right:auto
}
.total{
  font-size:20px;
  font-weight:bold;
  color:#d81b60;
  margin:20px 0
}
.shipping{
  background:#fff1c9;
  padding:12px;
  border-radius:10px;
  margin:15px 0;
  font-size:14px
}
input,textarea{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-family:inherit
}
.primary{
  background:#d81b60;
  color:white;
  width:100%;
  margin-top:8px
}
.whatsapp{
  background:#25d366;
  color:white;
  width:100%;
  margin-top:10px
}
.card-box{
  background:#f8f8f8;
  padding:15px;
  border-radius:12px;
  margin:15px 0
}
.user-box{
  background:white;
  padding:15px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 3px 12px #00000010
}
.hidden{display:none}
.logout{
  background:#eee;
  color:#c00
}
footer{
  text-align:center;
  padding:30px;
  color:#777
}
</style>
</head>

<body>

<header>
  <h1>🌸 هانلی</h1>
  <p>فروشگاه لوازم آرایشی و مراقبت پوست</p>

  <nav>
    <button class="nav-btn" onclick="openRegister()">👤 ثبت‌نام / ورود</button>
    <button class="nav-btn" onclick="openCart()">🛒 سبد خرید (<span id="cartCount">0</span>)</button>
  </nav>
</header>

<div class="container">

  <div id="userBox" class="user-box hidden"></div>

  <input
    id="search"
    class="search"
    placeholder="🔎 جستجوی محصول..."
    oninput="renderProducts()"
  >

  <div class="categories">
    <button onclick="filterProducts('همه')">همه</button>
    <button onclick="filterProducts('لب')">لب</button>
    <button onclick="filterProducts('چشم')">چشم</button>
    <button onclick="filterProducts('پوست')">پوست</button>
  </div>

  <div id="products" class="products"></div>

</div>

<footer>
  هانلی ❤️ خرید آسان و مطمئن
</footer>


<!-- سبد خرید -->
<div id="cartModal" class="modal">
  <div class="modal-box">

    <button class="close" onclick="closeCart()">✕ بستن</button>

    <h2>🛒 سبد خرید</h2>

    <div id="cartItems"></div>

    <div id="cartTotal" class="total"></div>

    <div class="shipping">
      🚚 هزینه ارسال بر عهده خریدار است و هنگام تحویل درب منزل پرداخت می‌شود.
    </div>

    <h3>📦 اطلاعات گیرنده</h3>

    <input id="name" placeholder="نام و نام خانوادگی">
    <input id="phone" placeholder="شماره موبایل">
    <textarea id="address" rows="3" placeholder="آدرس کامل"></textarea>

    <div class="card-box">
      <b>💳 پرداخت کارت به کارت</b>
      <p>شماره کارت:</p>
      <strong
