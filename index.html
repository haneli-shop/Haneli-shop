<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هانلی | فروشگاه لوازم آرایشی</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#fff7fb;
    color:#333;
}

header{
    background:linear-gradient(135deg,#d81b60,#ad1457);
    color:white;
    padding:18px 15px;
    text-align:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
    margin-bottom:6px;
}

.subtitle{
    font-size:14px;
    opacity:.9;
}

nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

nav button{
    border:0;
    border-radius:25px;
    padding:10px 16px;
    background:white;
    color:#ad1457;
    font-weight:bold;
    cursor:pointer;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.search{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    margin-bottom:15px;
    font-size:16px;
}

.categories{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
}

.categories button{
    border:0;
    padding:9px 15px;
    border-radius:20px;
    background:#f3d2df;
    color:#8e1747;
    cursor:pointer;
}

.categories button.active{
    background:#d81b60;
    color:white;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
}

.product{
    background:white;
    border-radius:18px;
    padding:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    text-align:center;
}
